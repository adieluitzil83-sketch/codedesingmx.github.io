<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Videos</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg,#0f172a,#1e293b);
      color:white;
      margin:0;
      padding:0;
      text-align:center;
    }

    header{
      background:#111827;
      padding:25px;
      font-size:32px;
      font-weight:bold;
      letter-spacing:2px;
      box-shadow:0 4px 10px rgba(0,0,0,0.5);
    }

    .contenedor{
      padding:30px;
    }

    .video{
      background:#1e293b;

      /* TAMAÑO MÁS PEQUEÑO */
      width:35%;
      max-width:350px;

      margin:30px auto;
      padding:15px;
      border-radius:20px;

      box-shadow:0 8px 20px rgba(0,0,0,0.5);
      transition:0.3s;

      border:2px solid rgba(255,255,255,0.1);
    }

    .video:hover{
      transform:scale(1.03);
      box-shadow:0 10px 25px rgba(0,0,0,0.7);
    }

    h3{
      margin-bottom:15px;
      font-size:20px;
      color:#38bdf8;
    }

    video{
      width:100%;
      height:auto;

      border-radius:15px;
      border:3px solid #38bdf8;
    }

    p{
      color:#cbd5e1;
      font-size:14px;
    }

  </style>
</head>

<body>

  <header>🎬 Mi Galería de Videos 🎬</header>

  <div class="contenedor">

    <div class="video">
      <h3>🌟 Nombre del video 1</h3>

      <video controls>
        <source src="../videos/proyec.mp4" type="video/mp4">
        Tu navegador no soporta video.
      </video>

      <p>Descripción corta del video.</p>
    </div>

    <div class="video">
      <h3>🔥 Nombre del video 2</h3>

      <video controls>
        <source src="../videos/ddd.mp4" type="video/mp4">
        Tu navegador no soporta video.
      </video>

      <p>Descripción corta del video.</p>
    </div>

  </div>

</body>
</html>
