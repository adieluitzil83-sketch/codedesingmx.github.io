<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería - CBTA 186</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    background-color:#eef3f7;
}

/* Encabezado */
header{
    background:#2c3e50;
    color:white;
    text-align:center;
    padding:30px;
}

/* Galería */
.galeria{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:20px;
}

.galeria img{
    width:300px;
    height:200px;
    margin:20px;
    border-radius:15px;
    box-shadow:0px 4px 8px rgba(0,0,0,0.2);
    transition:transform 0.3s;
}

.galeria img:hover{
    transform:scale(1.1);
}

</style>
</head>

<body>

<header>
<h1>Galería del Grupo</h1>

</header>
